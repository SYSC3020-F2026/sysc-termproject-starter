# CI pipeline for the SYSC term project (JPacman / Gradle).
# Place at: .github/workflows/ci.yml
#
# Runs on every push / pull request:
#   1. Compiles and runs the tests (Gradle).
#   2. Produces a JaCoCo coverage report (build/reports/jacoco/.../*.csv).
#   3. Runs JPacman's built-in static analysis (Checkstyle / PMD / SpotBugs).
#
# JPacman (SERG-Delft/jpacman) is self-contained — no companion libraries and
# no SonarCloud needed (static analysis is built into the Gradle build).

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '11'          # match the JPacman Gradle wrapper (adjust if needed)
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew || true

      # JPacman's smoke test launches the Swing UI, which needs a display.
      - name: Install virtual display (xvfb)
        run: sudo apt-get update && sudo apt-get install -y xvfb

      # 1 + 2: compile, run tests, JaCoCo report
      - name: Build & test (with coverage)
        run: xvfb-run -a ./gradlew test jacocoTestReport

      # 3: static analysis (built into JPacman)
      - name: Static analysis (Checkstyle / PMD / SpotBugs)
        run: ./gradlew checkstyleMain pmdMain spotbugsMain
        continue-on-error: true       # report findings without failing early

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: '**/build/reports/jacoco/'

# --- Coverage gate ---
# The Autograding workflow enforces the 90% gate via scripts/check_coverage.py.
# To fail this CI build below 90% too, add a jacocoTestCoverageVerification rule
# to build.gradle scoped to nl.tudelft.jpacman.board/level/npc.
